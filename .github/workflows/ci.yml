name: FlowCredit CI

# The smallest trustworthy remote regression gate for the frozen baseline:
# structural check + full Node test suite. No model providers, no network
# services, no secrets — the suite is deterministic and offline-friendly.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The 22.x job is a compatibility guard: it runs the whole suite one
      # major below the pin, so the bootstrap pin test skips itself there.
      FLOWCREDIT_NODE_COMPAT_GUARD: ${{ matrix.node-version == '22.x' && '1' || '' }}
    strategy:
      # Both versions report independently: a 22.x-only regression must not
      # hide a 24.x one. 24.x is the support target (.nvmrc, engines <25);
      # 22.x is a compatibility guard (node:sqlite unflagged since 22.13).
      fail-fast: false
      matrix:
        node-version: ["24.x", "22.x"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Print the Node version
        run: node --version
      - name: Structural check
        run: node scripts/check.mjs
      - name: Full test suite
        run: node --test
